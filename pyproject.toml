[project]
name = "autodub"
version = "0.1.0"
description = "Caption-faithful English dialogue tracks for anime you can already play"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "python-dotenv>=1.0.0",
  "httpx>=0.27.0",
  "pysubs2>=1.7.0",
  "numpy>=1.26.0",
  "soundfile>=0.12.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]
# Real vocal removal for M&E beds. demucs needs PYO3_USE_ABI3_FORWARD_COMPATIBILITY=1
# on Python 3.15 when building sphn. audio-separator is heavier (UVR/MelBand models).
separate = ["demucs>=4.0.0"]
separate-uvr = ["audio-separator[cpu]>=0.24.0"]
score = ["speechbrain>=1.0.0", "torch>=2.0.0"]

[dependency-groups]
dev = ["pytest>=8.0.0"]

[project.scripts]
autodub = "autodub.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
